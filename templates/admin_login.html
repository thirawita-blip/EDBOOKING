<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>เข้าสู่ระบบแอดมิน</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="adm-body adm-login-body">
    <main class="adm-login-card">
        <div class="adm-login-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        <h1>เข้าสู่ระบบผู้ดูแล</h1>
        <p class="muted">ระบบจัดการการจองห้อง คณะศึกษาศาสตร์</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="flash {{ category }}">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" class="adm-form">
            <label>ชื่อผู้ใช้แอดมิน
                <input name="username" required autofocus autocomplete="username">
            </label>
            <label>รหัสผ่าน
                <input type="password" name="password" required autocomplete="current-password">
            </label>
            <button type="submit" class="btn primary">เข้าสู่ระบบ</button>
        </form>

        <a class="adm-back" href="{{ url_for('landing') }}">← กลับหน้าหลัก</a>
    </main>
</body>
</html>
